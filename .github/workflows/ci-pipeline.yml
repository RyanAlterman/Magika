name: CI

on:
    push:
        branches: [release]
    pull_request:
        branches: [release]

jobs:
    build:
        strategy:
            fail-fast: false
            matrix:
                os:
                    - windows-latest

        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Configure
              run: cmake --preset default

            - name: Build
              run: cmake --build --preset default
